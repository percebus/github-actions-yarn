name: yarn audit

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
    inputs:
      ssh-private-key:
        type: string
        description: SSH private key
        required: false

      working-directory:
        type: string
        description: Working directory
        required: false
        default: .

      yarn_audit_cli_options:
        type: string
        description: Options to pass to the yarn
        required: false
        default: "--groups dependencies"

  workflow_call: # SRC: https://docs.github.com/en/actions/using-workflows/reusing-workflows
    inputs:
      ssh-private-key:
        type: string
        description: SSH private key
        required: false

      working-directory:
        type: string
        description: Working directory
        required: false
        default: .

      yarn_audit_cli_options:
        type: string
        description: Options to pass to the yarn
        required: false
        default: "--groups dependencies"

# NOTE: Set in final file
# permissions:
#   contents: read
#   pull-requests: read

jobs:
  # NOTE: is this job redundant?
  # does dependency-review-action accomplish the same, and more?
  yarn_audit:
    name: yarn audit
    runs-on: ubuntu-latest
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
        with:
          ssh-private-key: ${{ inputs.ssh-private-key }}

      - uses: percebus/github-actions-node/.github/actions/setup@main
      - uses: percebus/github-actions-yarn/.github/actions/install@main
      - uses: percebus/github-actions-yarn/.github/actions/audit@main
        with:
          working-directory: ${{ inputs.working-directory }}
          yarn_audit_cli_options: ${{ inputs.yarn_audit_cli_options }}
